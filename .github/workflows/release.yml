name: Publish release
on:
  push:
    branches: [main]
    paths: ['manifest.json', 'releases/**', '.github/workflows/release.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet test tests/JellyDaily.Tests -c Release
      - name: Verify packaged checksum
        run: |
          cd releases
          sha256sum --check SHA256SUMS
      - name: Read release version
        run: python3 -c 'import json, os; v=json.load(open("manifest.json"))[0]["versions"][0]["version"]; open(os.environ["GITHUB_ENV"], "a").write("RELEASE_TAG=v" + v + "\n")'
      - name: Publish tested package
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "Release $RELEASE_TAG already exists; keeping its assets unchanged."
          else
            gh release create "$RELEASE_TAG" "releases/JellyDaily_${RELEASE_TAG#v}.zip" manifest.json releases/SHA256SUMS \
              --prerelease --title "Daily Episodes $RELEASE_TAG (experimental MVP)" \
              --notes-file docs/release-notes.md
          fi
